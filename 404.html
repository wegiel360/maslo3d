<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masło3D</title>
  <script>
    // GitHub Pages dla głębokich linków SPA (/koszyk, /admin, ...) podaje 404.html.
    // Przekieruj do wersji bez podstrony, aby aplikacja (SPA) przejęła routing.
    try {
      var base = window.location.pathname.replace(/\/[^\/]*$/, '/');
      window.location.replace(base);
    } catch (e) { location.href = '/'; }
  </script>
</head>
<body>
  <p>Przenoszenie do sklepu…</p>
</body>
</html>
