<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Przekierowanie…</title>
  <script>
    var p = location.pathname;
    var base = p.replace(/\/[^\/]*$/, '/') || '/';
    var last = p.replace(/\/+$/, '');
    var seg = last.split('/').pop();
    if (seg === 'admin') location.replace(base + '?admin=true');
    else if (seg === 'koszyk') location.replace(base + '?view=koszyk');
    else location.replace(base);
  </script>
</head>
<body>
  <p>Przekierowywanie…</p>
</body>
</html>
