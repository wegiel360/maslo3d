function flash(msg,type='ok'){
  const el=document.createElement('div');
  el.className='fixed top-4 left-1/2 -translate-x-1/2 z-[9999] px-6 py-3 rounded-xl text-sm font-medium shadow-lg transition-all duration-300 opacity-0 -translate-y-2';
  el.classList.add(type==='ok'?'bg-emerald-500/90 text-white':'bg-red-500/90 text-white');
  el.textContent=msg;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{el.classList.remove('opacity-0','-translate-y-2');el.classList.add('opacity-100','translate-y-0')});
  setTimeout(()=>{el.classList.remove('opacity-100','translate-y-0');el.classList.add('opacity-0','-translate-y-2');setTimeout(()=>el.remove(),300)},3000);
}

async function sha256(text){
  const buffer=new TextEncoder().encode(text);
  const hash=await crypto.subtle.digest('SHA-256',buffer);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function fmtTime(sec){
  if(!sec&&sec!==0)return '—';
  sec=Math.round(sec);
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);
  if(h>0)return h+'h '+m+'min';
  if(m>0)return m+'min';
  return sec+'s';
}

function saveCart(){localStorage.setItem('m3d_cart',JSON.stringify(cart))}

function updateCartBadge(){
  const badge=$('#cartBadge');
  const total=cart.reduce((s,i)=>s+i.qty,0);
  if(badge){badge.textContent=total;badge.classList.toggle('hidden',total===0)}
}

function expandBundles(items){
  const out=[];
  items.forEach(ci=>{
    const p=products[ci.productId];
    if(!p)return;
    if(p.bundle&&p.bundle.items){
      p.bundle.items.forEach(bi=>{
        for(let i=0;i<bi.qty*ci.qty;i++)out.push({productId:bi.productId,qty:1});
      });
    }else{
      out.push(ci);
    }
  });
  return out;
}

function estPrintTime(items){
  let total=0;
  items.forEach(ci=>{
    const p=products[ci.productId];
    if(p&&p.printTimeSec)total+=p.printTimeSec*ci.qty;
  });
  return total;
}

function tagsToText(tags){
  if(!tags||!tags.length)return '';
  return tags.map(t=>{const d={whistle:'Gwizdek',fast:'Szybki',slow:'Wolny',large:'Duzy',small:'Maly',bundle:'Zestaw'};return d[t]||t}).join(', ');
}

db.ref('settings').on('value',snap=>{
  if(snap.val())settings={...settings,...snap.val()};
  renderBanner();
});
db.ref('products').on('value',snap=>{
  products=snap.val()||{};
  renderShop();
});
db.ref('orders').on('value',snap=>{
  orders=snap.val()||{};
  if($('#view-admin').classList.contains('hidden')===false)renderAdmin();
});

<script>
function renderBanner(){
  const b=$('#banner');
  if(b&&settings.banner){b.textContent=settings.banner;b.classList.remove('hidden')}
  else if(b)b.classList.add('hidden');
}

let whistleCtx=null;
function playWhistle(freq,duration){
  try{
    if(!whistleCtx)whistleCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(whistleCtx.state==='suspended')whistleCtx.resume();
    const osc=whistleCtx.createOscillator(),gain=whistleCtx.createGain();
    osc.type='sine';osc.frequency.value=freq||880;
    gain.gain.setValueAtTime(0.3,whistleCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01,whistleCtx.currentTime+(duration||0.5));
    osc.connect(gain);gain.connect(whistleCtx.destination);
    osc.start();osc.stop(whistleCtx.currentTime+(duration||0.5));
  }catch(e){}
}

function renderShop(){
  const grid=$('#productGrid');
  if(!grid)return;
  const mode=settings.mode;
  const list=Object.entries(products).filter(([id,p])=>!p.hidden);
  if(!list.length){grid.innerHTML='<p class="text-slate-400 col-span-full text-center py-12">Brak produktow</p>';return}
  grid.innerHTML=list.map(([id,p])=>{
    const price=(p.printTimeSec*p.pricePerGram||0).toFixed(2);
    const time=fmtTime(p.printTimeSec);
    const stockLeft=p.stock!=null?p.stock:null;
    const isBundle=!!p.bundle;
    const tags=tagsToText(p.tags);
    const whistleBtn=(p.tags&&p.tags.includes('whistle')&&p.whistleFreq)?
      '<button onclick="playWhistle('+p.whistleFreq+')" class="mt-2 px-3 py-1 rounded-lg bg-sky-500/20 text-sky-400 text-xs border border-sky-500/30 hover:bg-sky-500/30 transition">Posluchaj gwizdka</button>':'';
    const addBtn=(mode==='active'&&stockLeft!==null&&stockLeft<=0)?
      '<button disabled class="mt-3 w-full py-2 rounded-xl bg-slate-600/50 text-slate-400 text-sm cursor-not-allowed">Brak w magazynie</button>':
      '<button onclick="addToCart(\''+id+'\',1)" class="mt-3 w-full py-2 rounded-xl bg-accent/80 hover:bg-accent text-white text-sm font-medium transition">Dodaj do koszyka</button>';
    const bundleInfo=isBundle?'<span class="text-xs text-amber-400/80 block mt-1">Zestaw: '+p.bundle.items.length+' elementow</span>':'';
    const stockInfo=stockLeft!==null?'<span class="text-xs text-slate-400">Stan: '+stockLeft+'</span>':'';
    const tagsInfo=tags?'<span class="text-xs text-slate-400 block">'+tags+'</span>':'';
    return '<div class="bg-panel rounded-2xl p-4 flex flex-col items-center text-center">'
      +'<div class="w-full aspect-square rounded-xl overflow-hidden mb-3 bg-black/30 flex items-center justify-center">'
      +(p.img?'<img src="'+p.img+'" alt="'+(p.name||'')+'" class="w-full h-full object-contain" loading="lazy"/>'
        :'<span class="text-4xl">'+(p.emoji||'📦')+'</span>')
      +'</div>'
      +'<h3 class="font-semibold text-sm mb-1">'+(p.name||'Bez nazwy')+'</h3>'
      +'<p class="text-accent font-bold">'+price+' zl</p>'
      +'<p class="text-xs text-slate-400">Czas druku: '+time+'</p>'
      +bundleInfo+tagsInfo+stockInfo+whistleBtn+addBtn
      +'</div>';
  }).join('');
}

function addToCart(id,qty){
  const p=products[id];
  if(!p)return;
  const existing=cart.find(i=>i.productId===id);
  if(existing){existing.qty+=qty}
  else{cart.push({productId:id,qty})}
  saveCart();updateCartBadge();
  renderCart();
  flash('Dodano: '+(p.name||'produkt'));
}

function renderCart(){
  const el=$('#cartItems');
  const totalEl=$('#cartTotal');
  const submitBtn=$('#cartSubmit');
  if(!el)return;
  if(!cart.length){
    el.innerHTML='<p class="text-slate-400 text-sm text-center py-4">Koszyk jest pusty</p>';
    if(totalEl)totalEl.textContent='0.00 zl';
    if(submitBtn)submitBtn.disabled=true;
    return;
  }
  if(submitBtn)submitBtn.disabled=false;
  let total=0;
  el.innerHTML=cart.map((ci,idx)=>{
    const p=products[ci.productId];
    if(!p)return '';
    const lineTotal=(p.printTimeSec*p.pricePerGram||0)*ci.qty;
    total+=lineTotal;
    return '<div class="flex items-center justify-between py-2 border-b border-white/5">'
      +'<div class="flex-1"><span class="text-sm">'+(p.name||'?')+'</span>'
      +'<span class="text-xs text-slate-400 ml-2">x'+ci.qty+'</span></div>'
      +'<span class="text-sm text-accent">'+lineTotal.toFixed(2)+' zl</span>'
      +'<button onclick="removeFromCart('+idx+')" class="ml-2 text-red-400 hover:text-red-300 text-xs">Usun</button>'
      +'</div>';
  }).join('');
  if(totalEl)totalEl.textContent=total.toFixed(2)+' zl';
}

function removeFromCart(idx){
  cart.splice(idx,1);
  saveCart();updateCartBadge();renderCart();
}

function clearCart(){
  cart=[];saveCart();updateCartBadge();renderCart();
}
async function handleCheckout(){
  const nameEl=$('#custName'),classEl=$('#custClass'),noteEl=$('#custNote');
  const name=(nameEl?nameEl.value:'').trim();
  const cls=(classEl?classEl.value:'').trim();
  const note=(noteEl?noteEl.value:'').trim();
  if(!name||!cls){flash('Podaj imie i klase','err');return}
  if(!cart.length){flash('Koszyk jest pusty','err');return}
  if(cart.length>6){flash('Max 6 pozycji w koszyku','err');return}
  const lastOrder=parseInt(localStorage.getItem('m3d_lastOrderTime')||'0');
  if(Date.now()-lastOrder<120000){flash('Poczekaj 2 min przed kolejnym zamowieniem','err');return}

  const expanded=expandBundles(cart);
  const items=cart.map(ci=>{
    const p=products[ci.productId]||{};
    return{productId:ci.productId,name:p.name||'',qty:ci.qty,printTimeSec:p.printTimeSec||0,pricePerGram:p.pricePerGram||settings.pricePerGram||0};
  });
  const estPrint=estPrintTime(expanded);
  const total=items.reduce((s,i)=>s+(i.printTimeSec*i.pricePerGram*i.qty),0);

  const newRef=db.ref('orders').push();
  const orderId=newRef.key;
  const code=await generateOrderCode();
  const order={
    orderId,code,name,class:cls,note,items,estPrintSec:estPrint,
    total:parseFloat(total.toFixed(2)),
    status:'pending',
    createdAt:Date.now(),
    updatedAt:Date.now()
  };

  if(settings.mode==='active'){
    for(const ci of expanded){
      const ref=db.ref('products/'+ci.productId+'/stock');
      const snap=await ref.once('value');
      const cur=snap.val();
      if(cur!=null&&cur>0){
        await ref.set(cur-1);
      }
    }
  }

  await newRef.set(order);
  localStorage.setItem('m3d_lastOrderTime',String(Date.now()));
  cart=[];saveCart();updateCartBadge();renderCart();
  flash('Zamowienie #'+code+' zlozone!');
  showView('tracking');
  trackOrder(code);
}

async function generateOrderCode(){
  const snap=await db.ref('orders').once('value');
  const all=snap.val()||{};
  const used=new Set();
  Object.values(all).forEach(o=>{if(o.code)used.add(o.code)});
  for(let i=1;i<=999;i++){
    const code=String(i).padStart(3,'0');
    if(!used.has(code))return code;
  }
  return String(Date.now()%999+1).padStart(3,'0');
}

let trackUnsub=null;
function trackOrder(code){
  const el=$('#trackingResult');
  if(!el)return;
  el.innerHTML='<p class="text-slate-400">Szukam...</p>';
  if(trackUnsub){trackUnsub();trackUnsub=null}

  const q=db.ref('orders').orderByChild('code').equalTo(code);
  trackUnsub=q.on('value',snap=>{
    const data=snap.val();
    if(!data){el.innerHTML='<p class="text-red-400">Nie znaleziono zamowienia #'+code+'</p>';return}
    const o=Object.values(data)[0];
    const statusMap={pending:'Oczekuje',printing:'W druku',ready:'Gotowe',delivered:'Dostarczone',cancelled:'Anulowane'};
    const statusColors={pending:'text-yellow-400',printing:'text-blue-400',ready:'text-emerald-400',delivered:'text-slate-400',cancelled:'text-red-400'};
    const st=o.status||'pending';
    el.innerHTML='<div class="bg-panel rounded-2xl p-5 max-w-md mx-auto">'
      +'<h3 class="text-lg font-bold mb-2">Zamowienie #'+o.code+'</h3>'
      +'<p class="text-sm text-slate-300">Imie: '+o.name+'</p>'
      +'<p class="text-sm text-slate-300">Klasa: '+o.class+'</p>'
      +'<p class="text-sm text-slate-300">Status: <span class="'+(statusColors[st]||'text-slate-300')+' font-medium">'+(statusMap[st]||st)+'</span></p>'
      +'<p class="text-sm text-slate-300 mt-1">Czas druku: '+fmtTime(o.estPrintSec)+'</p>'
      +'<p class="text-sm text-slate-300">Suma: '+(o.total||0).toFixed(2)+' zl</p>'
      +'<p class="text-xs text-slate-400 mt-2">Dane dostawy: '+o.name+' '+o.class+(o.note?' | '+o.note:'')+'</p>'
      +'</div>';
  });
}

function showView(view){
  $$('.view-section').forEach(s=>s.classList.add('hidden'));
  const el=$('#view-'+view);
  if(el)el.classList.remove('hidden');
  if(view==='shop'){renderShop();renderCart()}
  if(view==='admin'){initAdmin()}
  window.scrollTo({top:0,behavior:'smooth'});
}

let authed=false;
function isAdminAuthed(){return authed||sessionStorage.getItem('m3d_admin')==='1'}

async function initAdmin(){
  if(!isAdminAuthed()){
    $('#adminLoginView').classList.remove('hidden');
    $('#adminPanelView').classList.add('hidden');
    return;
  }
  $('#adminLoginView').classList.add('hidden');
  $('#adminPanelView').classList.remove('hidden');
  renderAdmin();
}

async function handleAdminLogin(){
  const pw=$('#adminPw').value;
  if(!pw){flash('Podaj haslo','err');return}
  const hash=await sha256(pw);
  if(hash===settings.adminPasswordHash){
    authed=true;sessionStorage.setItem('m3d_admin','1');
    $('#adminLoginView').classList.add('hidden');
    $('#adminPanelView').classList.remove('hidden');
    renderAdmin();
    flash('Zalogowano');
  }else{
    flash('Bledne haslo','err');
  }
}

function adminLogout(){
  authed=false;sessionStorage.removeItem('m3d_admin');
  $('#adminLoginView').classList.remove('hidden');
  $('#adminPanelView').classList.add('hidden');
}

function setAdminView(v){
  adminView=v;
  $$('.admin-tab').forEach(t=>t.classList.toggle('hidden',t.dataset.tab!==v));
  $$('.admin-tab-btn').forEach(b=>{
    if(b.dataset.tab===v){b.classList.add('bg-accent/30','text-white')}
    else{b.classList.remove('bg-accent/30','text-white')}
  });
  renderAdmin();
}

function renderAdmin(){
  if(!isAdminAuthed())return;
  if(adminView==='dashboard')renderStats();
  if(adminView==='products')renderAdminProducts();
  if(adminView==='orders')renderAdminOrders();
  if(adminView==='queue')renderPrintQueue();
  if(adminView==='settings')renderAdminSettings();
}

function renderStats(){
  const el=$('#adminStats');if(!el)return;
  const all=Object.values(orders);
  const pending=all.filter(o=>o.status==='pending').length;
  const printing=all.filter(o=>o.status==='printing').length;
  const ready=all.filter(o=>o.status==='ready').length;
  const delivered=all.filter(o=>o.status==='delivered').length;
  const totalRevenue=all.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+(o.total||0),0);
  const totalCount=all.length;
  el.innerHTML='<div class="grid grid-cols-2 md:grid-cols-5 gap-3">'
    +'<div class="bg-panel rounded-xl p-4 text-center"><p class="text-2xl font-bold text-accent">'+totalCount+'</p><p class="text-xs text-slate-400">Wszystkie</p></div>'
    +'<div class="bg-panel rounded-xl p-4 text-center"><p class="text-2xl font-bold text-yellow-400">'+pending+'</p><p class="text-xs text-slate-400">Oczekujace</p></div>'
    +'<div class="bg-panel rounded-xl p-4 text-center"><p class="text-2xl font-bold text-blue-400">'+printing+'</p><p class="text-xs text-slate-400">W druku</p></div>'
    +'<div class="bg-panel rounded-xl p-4 text-center"><p class="text-2xl font-bold text-emerald-400">'+ready+'</p><p class="text-xs text-slate-400">Gotowe</p></div>'
    +'<div class="bg-panel rounded-xl p-4 text-center"><p class="text-2xl font-bold text-slate-300">'+totalRevenue.toFixed(2)+' zl</p><p class="text-xs text-slate-400">Przychod</p></div>'
    +'</div>';
  renderChart(all);
}

function renderChart(all){
  const el=$('#adminChart');if(!el)return;
  const byDay={};
  all.forEach(o=>{
    if(!o.createdAt)return;
    const d=new Date(o.createdAt).toLocaleDateString('pl-PL');
    byDay[d]=(byDay[d]||0)+1;
  });
  const labels=Object.keys(byDay).slice(-7);
  const data=labels.map(l=>byDay[l]);
  const max=Math.max(...data,1);
  el.innerHTML='<div class="flex items-end gap-1 h-24">'
    +labels.map((l,i)=>'<div class="flex flex-col items-center flex-1">'
      +'<span class="text-xs text-slate-400">'+data[i]+'</span>'
      +'<div class="w-full bg-accent/60 rounded-t" style="height:'+((data[i]/max)*80)+'px"></div>'
      +'<span class="text-xs text-slate-500 mt-1">'+l.split('.')[0]+'</span>'
      +'</div>').join('')
    +'</div>';
}

function renderAdminOrders(){
  const el=$('#adminOrdersList');if(!el)return;
  const list=Object.entries(orders).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
  if(!list.length){el.innerHTML='<p class="text-slate-400 text-sm py-4">Brak zamowien</p>';return}
  el.innerHTML=list.map(([id,o])=>{
    const st=o.status||'pending';
    const statusMap={pending:'Oczekuje',printing:'W druku',ready:'Gotowe',delivered:'Dostarczone',cancelled:'Anulowane'};
    const stClass={pending:'bg-yellow-500/20 text-yellow-400',printing:'bg-blue-500/20 text-blue-400',ready:'bg-emerald-500/20 text-emerald-400',delivered:'bg-slate-500/20 text-slate-400',cancelled:'bg-red-500/20 text-slate-500'};
    return '<div class="bg-panel rounded-xl p-3 mb-2 flex flex-col md:flex-row md:items-center gap-2">'
      +'<div class="flex-1">'
      +'<span class="font-bold text-sm">#'+(o.code||'?')+'</span> '
      +'<span class="text-sm">'+o.name+' '+o.class+'</span> '
      +'<span class="text-xs px-2 py-0.5 rounded-full '+(stClass[st]||'')+'">'+(statusMap[st]||st)+'</span>'
      +'</div>'
      +'<div class="flex gap-1 flex-wrap">'
      +['pending','printing','ready','delivered','cancelled'].map(s=>
        '<button onclick="setOrderStatus(\''+id+'\',\''+s+'\')" class="text-xs px-2 py-1 rounded-lg bg-white/5 hover:bg-white/10 transition">'+((statusMap[s]||s).substring(0,4))+'</button>'
      ).join('')
      +'<button onclick="deleteOrder(\''+id+'\')" class="text-xs px-2 py-1 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/30 transition">X</button>'
      +'</div></div>';
  }).join('');
}

async function setOrderStatus(id,status){
  await db.ref('orders/'+id).update({status,updatedAt:Date.now()});
  flash('Status: '+status);
}

async function deleteOrder(id){
  if(!confirm('Usunac zamowienie?'))return;
  await db.ref('orders/'+id).remove();
  flash('Usunieto');
}

function renderPrintQueue(){
  const el=$('#adminQueueList');if(!el)return;
  const list=Object.entries(orders)
    .filter(([id,o])=>o.status==='pending'||o.status==='printing')
    .sort((a,b)=>(a[1].estPrintSec||0)-(b[1].estPrintSec||0));
  if(!list.length){el.innerHTML='<p class="text-slate-400 text-sm py-4">Brak w kolejce</p>';return}
  el.innerHTML=list.map(([id,o],idx)=>{
    const st=o.status||'pending';
    return '<div class="bg-panel rounded-xl p-3 mb-2 flex items-center gap-3">'
      +'<span class="text-lg font-bold text-accent w-8 text-center">'+(idx+1)+'</span>'
      +'<div class="flex-1">'
      +'<span class="font-bold text-sm">#'+(o.code||'?')+'</span> '
      +'<span class="text-sm">'+o.name+' '+o.class+'</span>'
      +'<p class="text-xs text-slate-400">Czas: '+fmtTime(o.estPrintSec)+' | '+(o.total||0).toFixed(2)+' zl</p>'
      +'</div>'
      +'<div class="flex gap-1">'
      +(st==='pending'?'<button onclick="setOrderStatus(\''+id+'\',\'printing\')" class="text-xs px-2 py-1 rounded-lg bg-blue-500/20 text-blue-400 hover:bg-blue-500/30 transition">Drukuj</button>':'')
      +(st==='printing'?'<button onclick="setOrderStatus(\''+id+'\',\'ready\')" class="text-xs px-2 py-1 rounded-lg bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30 transition">Gotowe</button>':'')
      +'</div></div>';
  }).join('');
}

function renderAdminProducts(){
  const el=$('#adminProductsList');if(!el)return;
  const list=Object.entries(products);
  if(!list.length){el.innerHTML='<p class="text-slate-400 text-sm py-4">Brak produktow</p>';return}
  el.innerHTML=list.map(([id,p])=>{
    return '<div class="bg-panel rounded-xl p-3 mb-2 flex flex-col md:flex-row md:items-center gap-2">'
      +'<div class="flex-1">'
      +'<span class="font-semibold text-sm">'+(p.name||'?')+'</span>'
      +'<span class="text-xs text-slate-400 ml-2">'+fmtTime(p.printTimeSec)+'</span>'
      +'<span class="text-xs text-slate-400 ml-2">Stan: '+(p.stock!=null?p.stock:'∞')+'</span>'
      +(p.bundle?'<span class="text-xs text-amber-400 ml-2">Zestaw</span>':'')
      +'</div>'
      +'<div class="flex gap-1">'
      +'<button onclick="editProduct(\''+id+'\')" class="text-xs px-2 py-1 rounded-lg bg-white/5 hover:bg-white/10 transition">Edytuj</button>'
      +'<button onclick="toggleProduct(\''+id+'\')" class="text-xs px-2 py-1 rounded-lg '+(p.hidden?'bg-emerald-500/20 text-emerald-400':'bg-red-500/20 text-red-400')+' transition">'+(p.hidden?'Widoczny':'Ukryty')+'</button>'
      +'<button onclick="deleteProduct(\''+id+'\')" class="text-xs px-2 py-1 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/30 transition">X</button>'
      +'</div></div>';
  }).join('');
}

async function toggleProduct(id){
  const p=products[id];if(!p)return;
  await db.ref('products/'+id+'/hidden').set(!p.hidden);
}

async function deleteProduct(id){
  if(!confirm('Usunac produkt?'))return;
  await db.ref('products/'+id).remove();
  flash('Usunieto produkt');
}

function editProduct(id){
  const p=products[id];if(!p)return;
  $('#prodFormId').value=id;
  $('#prodFormName').value=p.name||'';
  $('#prodFormPrintTime').value=p.printTimeSec||0;
  $('#prodFormManualTime').value=p.manualTimeSec||'';
  $('#prodFormPrice').value=p.pricePerGram||'';
  $('#prodFormStock').value=p.stock!=null?p.stock:'';
  $('#prodFormImg').value=p.img||'';
  $('#prodFormEmoji').value=p.emoji||'';
  $('#prodFormWhistleFreq').value=p.whistleFreq||'';
  const tags=(p.tags||[]).join(',');
  $('#prodFormTags').value=tags;
  $('#prodFormHidden').checked=!!p.hidden;
  if(p.bundle){
    $('#prodFormBundle').checked=true;
    $('#prodFormBundleItems').value=JSON.stringify(p.bundle.items);
    $('#bundleSection').classList.remove('hidden');
  }else{
    $('#prodFormBundle').checked=false;
    $('#prodFormBundleItems').value='[]';
    $('#bundleSection').classList.add('hidden');
  }
  $('#productFormModal').classList.remove('hidden');
}

function resetProductForm(){
  $('#prodFormId').value='';
  $('#prodFormName').value='';
  $('#prodFormPrintTime').value='';
  $('#prodFormManualTime').value='';
  $('#prodFormPrice').value='';
  $('#prodFormStock').value='';
  $('#prodFormImg').value='';
  $('#prodFormEmoji').value='';
  $('#prodFormWhistleFreq').value='';
  $('#prodFormTags').value='';
  $('#prodFormHidden').checked=false;
  $('#prodFormBundle').checked=false;
  $('#prodFormBundleItems').value='[]';
  $('#bundleSection').classList.add('hidden');
  $('#productFormModal').classList.remove('hidden');
}

async function saveProduct(){
  const id=$('#prodFormId').value||db.ref('products').push().key;
  const tagsStr=$('#prodFormTags').value.trim();
  const tags=tagsStr?tagsStr.split(',').map(t=>t.trim()).filter(Boolean):[];
  let bundle=null;
  if($('#prodFormBundle').checked){
    try{bundle={items:JSON.parse($('#prodFormBundleItems').value||'[]')}}
    catch(e){flash('Bledny format bundle JSON','err');return}
  }
  const data={
    name:$('#prodFormName').value.trim(),
    printTimeSec:parseFloat($('#prodFormPrintTime').value)||0,
    manualTimeSec:parseFloat($('#prodFormManualTime').value)||0,
    pricePerGram:parseFloat($('#prodFormPrice').value)||settings.pricePerGram||0.30,
    stock:$('#prodFormStock').value!==''?parseInt($('#prodFormStock').value):null,
    img:$('#prodFormImg').value.trim(),
    emoji:$('#prodFormEmoji').value.trim(),
    whistleFreq:parseFloat($('#prodFormWhistleFreq').value)||0,
    tags,
    hidden:$('#prodFormHidden').checked,
    bundle
  };
  await db.ref('products/'+id).set(data);
  $('#productFormModal').classList.add('hidden');
  flash('Zapisano produkt');
}

function renderAdminSettings(){
  const el=$('#adminSettingsContent');if(!el)return;
  el.innerHTML='<div class="space-y-4">'
    +'<div><label class="text-sm text-slate-400 block mb-1">Tryb</label>'
    +'<select id="setMode" class="w-full bg-panel rounded-xl px-3 py-2 text-sm border border-white/10">'
    +'<option value="vacation" '+(settings.mode==='vacation'?'selected':'')+' >Wakacje (zbieranie)</option>'
    +'<option value="active" '+(settings.mode==='active'?'selected':'')+' >Aktywny (drukowanie)</option>'
    +'</select></div>'
    +'<div><label class="text-sm text-slate-400 block mb-1">Banner</label>'
    +'<textarea id="setBanner" class="w-full bg-panel rounded-xl px-3 py-2 text-sm border border-white/10" rows="2">'+(settings.banner||'')+'</textarea></div>'
    +'<div><label class="text-sm text-slate-400 block mb-1">Cena za gram (zl)</label>'
    +'<input id="setPrice" type="number" step="0.01" value="'+(settings.pricePerGram||0.30)+'" class="w-full bg-panel rounded-xl px-3 py-2 text-sm border border-white/10"/></div>'
    +'<button onclick="saveSettings()" class="px-4 py-2 rounded-xl bg-accent/80 hover:bg-accent text-white text-sm font-medium transition">Zapisz</button>'
    +'</div>';
}

async function saveSettings(){
  await db.ref('settings').update({
    mode:$('#setMode').value,
    banner:$('#setBanner').value,
    pricePerGram:parseFloat($('#setPrice').value)||0.30
  });
  flash('Ustawienia zapisane');
}
</script>

      <div><label class="text-xs text-slate-400 block mb-1">Uwagi</label><textarea id="custNote" class="w-full bg-panel rounded-xl px-3 py-2 text-sm border border-white/10" rows="2" placeholder="Opcjonalne uwagi..."></textarea></div>

      <button id="cartSubmit" onclick="handleCheckout()" class="flex-1 py-2 rounded-xl bg-accent/80 hover:bg-accent text-white text-sm font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">Zamow</button>
    </div>
  </section>

  <!-- TRACKING -->

  <!-- ADMIN LOGIN -->

        <button onclick="handleAdminLogin()" class="w-full py-2 rounded-xl bg-accent/80 hover:bg-accent text-white text-sm font-medium transition">Zaloguj</button>
      </div>
    </div>
    <div id="adminPanelView" class="hidden">

      <div class="flex gap-2 mb-4 flex-wrap">

        <button onclick="setAdminView('products')" class="admin-tab-btn px-3 py-1.5 rounded-lg text-xs bg-white/5 hover:bg-white/10 transition" data-tab="products">Produkty</button>
        <button onclick="setAdminView('orders')" class="admin-tab-btn px-3 py-1.5 rounded-lg text-xs bg-white/5 hover:bg-white/10 transition" data-tab="orders">Zamowienia</button>
        <button onclick="setAdminView('queue')" class="admin-tab-btn px-3 py-1.5 rounded-lg text-xs bg-white/5 hover:bg-white/10 transition" data-tab="queue">Kolejka druku</button>

      <div id="adminOrdersTab" class="admin-tab hidden" data-tab="orders"><div id="adminOrdersList"></div></div>
      <div id="adminQueueTab" class="admin-tab hidden" data-tab="queue">

<!-- Product Form Modal -->
<div id="productFormModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60" onclick="if(event.target===this)$('#productFormModal').classList.add('hidden')">
  <div class="bg-panel rounded-2xl p-5 w-full max-w-md mx-4 max-h-[90vh] overflow-y-auto">
    <h3 class="font-bold text-sm mb-3">Produkt</h3>
    <input type="hidden" id="prodFormId"/>
    <div class="space-y-3">
      <div><label class="text-xs text-slate-400 block mb-1">Nazwa</label><input id="prodFormName" class="w-full bg-panel rounded-xl px-3 py-2 text-sm border border-white/10"/></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-xs text-slate-400 block mb-1">Czas druku (s) *</label><input id="prodFormPrintTime" type="number" class="w-full bg-panel rounded-xl px-3 py-2 text-sm border border-white/10"/></div>
        <div><label class="text-xs text-slate-400 block mb-1">Czas reczny (s)</label><input id="prodFormManualTime" type="number" class="w-full bg-panel rounded-xl px-3 py-2 text-sm border border-white/10"/></div>
      </div>
      <div class="grid grid-cols-2 gap-2">

      </div>
      <div><label class="text-xs text-slate-400 block mb-1">Obraz URL</label><input id="prodFormImg" class="w-full bg-panel rounded-xl px-3 py-2 text-sm border border-white/10"/></div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-xs text-slate-400 block mb-1">Emoji</label><input id="prodFormEmoji" class="w-full bg-panel rounded-xl px-3 py-2 text-sm border border-white/10"/></div>
        <div><label class="text-xs text-slate-400 block mb-1">Czest. gwiżdżka (Hz)</label><input id="prodFormWhistleFreq" type="number" class="w-full bg-panel rounded-xl px-3 py-2 text-sm border border-white/10"/></div>

      <div class="flex items-center gap-2"><input type="checkbox" id="prodFormHidden" class="accent-accent"/><label for="prodFormHidden" class="text-xs text-slate-400">Ukryty</label></div>
      <div class="flex items-center gap-2"><input type="checkbox" id="prodFormBundle" class="accent-accent" onchange="$('#bundleSection').classList.toggle('hidden',!this.checked)"/><label for="prodFormBundle" class="text-xs text-slate-400">Zestaw (bundle)</label></div>
      <div id="bundleSection" class="hidden"><label class="text-xs text-slate-400 block mb-1">Bundle items JSON</label><textarea id="prodFormBundleItems" class="w-full bg-panel rounded-xl px-3 py-2 text-sm border border-white/10" rows="3" placeholder='[{"productId":"xxx","qty":1}]'></textarea></div>
      <div class="flex gap-2 pt-2">
        <button onclick="$('#productFormModal').classList.add('hidden')" class="flex-1 py-2 rounded-xl bg-white/5 text-slate-400 text-sm hover:bg-white/10 transition">Anuluj</button>

      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{
  const params=new URLSearchParams(window.location.search);
  const orderCode=params.get('o');
  const orderId=params.get('orderId');
  if(orderCode){showView('tracking');setTimeout(()=>trackOrder(orderCode),500)}
  else if(orderId){showView('tracking');setTimeout(()=>{
    db.ref('orders/'+orderId).once('value').then(snap=>{
      const o=snap.val();if(o&&o.code)trackOrder(o.code);
    });
  },500)}
  updateCartBadge();
  renderCart();
});
</script>
